apiVersion: skaffold/v4beta1
kind: Config
metadata:
  name: identity-saml-provider

# Tiered deploy: each module below requires its predecessor(s) and will only
# render/apply after they finish (including their `after` readiness hooks).
# Dependency DAG:
#   postgres ─┬─► ory ─┬─► apps ─► traefik
#             │        └─► setup
#             └─► saml-migrate ─► apps
requires:
  - path: skaffold/00-postgres.yaml
    configs: [postgres]
  - path: skaffold/10-ory.yaml
    configs: [ory]
  - path: skaffold/15-saml-migrate.yaml
    configs: [saml-migrate]
  - path: skaffold/20-apps.yaml
    configs: [apps]
  - path: skaffold/30-setup.yaml
    configs: [setup]
  - path: skaffold/40-traefik.yaml
    configs: [traefik]

build:
  artifacts:
  - image: identity-saml-provider
    custom:
      buildCommand: ./skaffold-build.sh
      dependencies:
        paths:
          - rockcraft.yaml
    platforms: ["linux/amd64"]

portForward:
  - resourceType: service
    resourceName: traefik
    namespace: default
    port: 80
    localPort: 8080
  - resourceType: service
    resourceName: identity-saml-provider
    namespace: default
    port: 8082
    localPort: 8082
  - resourceType: service
    resourceName: hydra
    namespace: default
    port: 4444
    localPort: 4444
  - resourceType: service
    resourceName: hydra
    namespace: default
    port: 4445
    localPort: 4445
  - resourceType: service
    resourceName: postgres
    namespace: default
    port: 5432
    localPort: 5432
  - resourceType: service
    resourceName: login-ui
    namespace: default
    port: 4455
    localPort: 4455
  - resourceType: service
    resourceName: kratos
    namespace: default
    port: 4433
    localPort: 4433
  - resourceType: service
    resourceName: kratos
    namespace: default
    port: 4434
    localPort: 4434
