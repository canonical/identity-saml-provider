name: PR Agent AI Code Review

on:
  issue_comment:
    types: [created] # Allows developers to trigger commands like /review or /improve via comments

jobs:
  pr_agent_job:
    # Prevent the bot from triggering loops on its own comments
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write

    steps:
      - name: Run PR Agent
        uses: the-pr-agent/pr-agent@10bbd9a41061605e18ac8bab94d49a2d12a1f3a5 # main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_CI_KEY }}

          # Control which tools trigger automatically on PR events
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false" # Kept false to protect budget; run manually via comment command
