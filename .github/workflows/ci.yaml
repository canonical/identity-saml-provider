name: ci
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v**"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read
  packages: write

jobs:
  pre-commit:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/pre-commit.yaml

  build:
    uses: canonical/identity-team/.github/workflows/_rock-build.yaml@1bf335af1d939c8543e53d376dd49d79126c2cd3 # v1.15.0

  unit-test:
    uses: ./.github/workflows/unittest.yaml

  gh-publish:
    if: ${{ (github.ref == 'refs/heads/main') || (github.ref_type == 'tag') }}
    needs: [ build, unit-test ]
    uses: canonical/identity-team/.github/workflows/_rock-gh-publish.yaml@1bf335af1d939c8543e53d376dd49d79126c2cd3 # v1.15.0
    with:
      rock: ${{ needs.build.outputs.rock }}
