name: ci
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v**"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read
  packages: write

jobs:
  pre-commit:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/pre-commit.yaml

  openspec-check:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/openspec-check.yaml

  build:
    uses: canonical/identity-team/.github/workflows/_rock-build.yaml@990a60c1a8f3017af7236b91f0e24eb2e7999657 # v1.19.1

  unit-test:
    uses: ./.github/workflows/unittest.yaml

  gh-publish:
    if: ${{ (github.ref == 'refs/heads/main') || (github.ref_type == 'tag') }}
    needs: [ build, unit-test ]
    uses: canonical/identity-team/.github/workflows/_rock-gh-publish.yaml@990a60c1a8f3017af7236b91f0e24eb2e7999657 # v1.19.1
    with:
      rock: ${{ needs.build.outputs.rock }}
