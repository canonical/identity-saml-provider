name: ci
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v**"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read
  packages: write

jobs:
  pre-commit:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/pre-commit.yaml

  build:
    uses: canonical/identity-team/.github/workflows/_rock-build.yaml@5830f3e6723de07cb5b7ccb6c84031d8b2964c62 # v1.11.4

  unit-test:
    uses: ./.github/workflows/unittest.yaml

  gh-publish:
    if: ${{ (github.ref == 'refs/heads/main') || (github.ref_type == 'tag') }}
    needs: [ build, unit-test ]
    uses: canonical/identity-team/.github/workflows/_rock-gh-publish.yaml@5830f3e6723de07cb5b7ccb6c84031d8b2964c62 # v1.11.4
    with:
      rock: ${{ needs.build.outputs.rock }}
