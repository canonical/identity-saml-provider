name: AI Code Review

on:
  issue_comment:
    types: [created]

jobs:
  ai_code_review:
    name: Agentic Code Review
    permissions:
      contents: read
      pull-requests: write
      issues: write
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - name: Parse Model from Comment
        id: parse_model
        run: |
          COMMENT="${{ github.event.comment.body }}"
          if [[ "$COMMENT" =~ model=([^ ]+) ]]; then
              echo "MODEL=${BASH_REMATCH[1]}" >> $GITHUB_ENV
          else
              echo "MODEL=openrouter/deepseek/deepseek-v4-flash" >> $GITHUB_ENV
          fi

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Run AI Code Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_CI_KEY }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY_NAME: ${{ github.repository }}
          MODEL: ${{ env.MODEL }}
        run: |
          uv run scripts/ai_code_review.py
