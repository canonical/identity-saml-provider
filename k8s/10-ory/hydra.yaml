apiVersion: v1
kind: Service
metadata:
  name: hydra
  labels:
    app: hydra
spec:
  ports:
  - port: 4444
    name: public
    targetPort: 4444
  - port: 4445
    name: admin
    targetPort: 4445
  selector:
    app: hydra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra
  labels:
    app: hydra
spec:
  selector:
    matchLabels:
      app: hydra
  template:
    metadata:
      labels:
        app: hydra
    spec:
      initContainers:
      - name: hydra-migrate
        image: ghcr.io/canonical/hydra:25.4.0
        command: ["hydra", "migrate", "-c", "/etc/config/hydra/hydra.yml", "sql", "-e", "--yes"]
        env:
        - name: DSN
          value: postgres://hydra:hydra@postgres:5432/hydra?sslmode=disable
        volumeMounts:
        - name: hydra-config
          mountPath: /etc/config/hydra
      containers:
      - name: hydra
        image: ghcr.io/canonical/hydra:25.4.0
        command: ["hydra", "serve", "-c", "/etc/config/hydra/hydra.yml", "all", "--dev"]
        env:
        - name: DSN
          value: postgres://hydra:hydra@postgres:5432/hydra?sslmode=disable
        ports:
        - containerPort: 4444
          name: public
        - containerPort: 4445
          name: admin
        volumeMounts:
        - name: hydra-config
          mountPath: /etc/config/hydra
      volumes:
      - name: hydra-config
        configMap:
          name: hydra-config
