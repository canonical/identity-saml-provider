apiVersion: batch/v1
kind: Job
metadata:
  name: kratos-setup
  labels:
    app: kratos-setup
spec:
  template:
    spec:
      containers:
      - name: kratos-setup
        image: ghcr.io/canonical/kratos:25.4.0
        command:
          - kratos
          - import
          - identities
          - /etc/config/kratos/identity.json
          - --endpoint
          - http://kratos:4434
        volumeMounts:
        - name: kratos-config
          mountPath: /etc/config/kratos
      volumes:
      - name: kratos-config
        configMap:
          name: kratos-config
      restartPolicy: OnFailure
