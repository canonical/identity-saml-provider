apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres.yaml

configMapGenerator:
  - name: postgres-init
    files:
      - ../postgres/init-database.sql

secretGenerator:
  # postgres-credentials is generated here because both the
  # saml-provider-migrate Job and the identity-saml-provider Deployment
  # reference it by name at runtime.
  - name: postgres-credentials
    literals:
      - password=postgres

generatorOptions:
  disableNameSuffixHash: true
