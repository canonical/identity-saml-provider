apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - identity-saml-provider.yaml
  - login-ui.yaml
  - identity-saml-provider-janitor.yaml

secretGenerator:
  - name: saml-certs
    files:
      # Certs for k8s are generated by `make k8s-certs` into k8s/certs/.
      - bridge.crt=../certs/bridge.crt
      - bridge.key=../certs/bridge.key
    type: Opaque

generatorOptions:
  disableNameSuffixHash: true
